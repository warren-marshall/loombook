services:
  db:
    # PostGIS build of Postgres 17 - the Location entity stores coordinates as
    # geography(Point, 4326), which stock postgres:17-alpine cannot create.
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loombook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
